name: Firmware por perfil de hardware
on:
  push:
    branches: [master, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install platformio==6.1.19
      - run: python -m unittest discover -s tests
      - name: Compilar todos los perfiles del catálogo
        run: |
          python - <<'PY'
          import json, subprocess
          profiles = json.load(open('hardware-profiles.json'))['profiles']
          command = ['pio', 'run']
          for profile in profiles:
              command.extend(['-e', profile['id']])
          subprocess.run(command, check=True)
          PY
      - name: Empaquetar y comprobar versión del tag
        run: |
          python - <<'PY'
          import json, os, subprocess
          version = json.load(open('.pio/build/waveshare_epaper154/artifact.json'))['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'El tag no coincide con el firmware'
          subprocess.run(['python', 'tools/package_firmware.py', '--version', version], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-todos-los-perfiles
          path: dist/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-todos-los-perfiles
          path: dist
      - name: Crear release en borrador para revisar antes de publicar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --generate-notes
