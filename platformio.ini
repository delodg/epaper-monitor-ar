; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = waveshare_epaper154

; Opciones comunes. Cada perfil configura su memoria y su panel.
[env]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino

; Bundle de CAs raíz (Mozilla) para validar certificados TLS; generado con
; gen_crt_bundle.py de ESP-IDF (ver docs/desarrollo.md). Rutas anonimizadas en el binario.
board_build.embed_files = certs/x509_crt_bundle
extra_scripts = pre:tools/pio_prefix_map.py, post:tools/pio_artifacts.py
build_flags = 
	-DCORE_DEBUG_LEVEL=1
	-DFW_VERSION=\"1.4.0\"
lib_deps = 
	zinggjm/GxEPD2@1.6.9
	adafruit/Adafruit GFX Library@^1.12.1
	adafruit/Adafruit BusIO@^1.17.2
	olikraus/U8g2_for_Adafruit_GFX@^1.8.0
	tzapu/WiFiManager@^2.0.17
	bblanchon/ArduinoJson@^7.4.2
	ricmoo/QRCode@^0.0.1
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
upload_speed = 460800

; Waveshare ESP32-S3-ePaper-1.54 (V2): panel blanco/negro SSD1681 (GxEPD2_154_D67)
[waveshare]
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
build_flags =
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:waveshare_epaper154]
extends = waveshare

[env:waveshare_epaper154_v1]
extends = waveshare
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = min_spiffs.csv
build_flags =
	${waveshare.build_flags}
	-DBOARD_WAVESHARE_V1

; Waveshare ESP32-S3-ePaper-1.54G: mismo mapa de pines, panel de 4 colores (rojo/amarillo/
; negro/blanco) con controlador JD79660 (GxEPD2_154c_GDEM0154F51H, GxEPD2 >= 1.6.6).
; El refresco tarda ~20 s y no hay parcial real: ver EPD_MIN_CLOCK_MIN en include/config.h.
[env:waveshare_epaper154g]
extends = waveshare
build_flags =
	${waveshare.build_flags}
	-DEPD_PANEL_154G

; Genéricos: panel externo, sin PSRAM ni circuito de batería; alimentados por USB.
[generic_esp32]
board = esp32dev
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_flags =
	${env.build_flags}
	-DBOARD_GENERIC_ESP32

[env:esp32dev_epaper154]
extends = generic_esp32

[env:esp32dev_epaper154g]
extends = generic_esp32
build_flags =
	${generic_esp32.build_flags}
	-DEPD_PANEL_154G

[generic_s3]
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
	${env.build_flags}
	-DBOARD_GENERIC_S3
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3dev_epaper154]
extends = generic_s3

[env:esp32s3dev_epaper154g]
extends = generic_s3
build_flags =
	${generic_s3.build_flags}
	-DEPD_PANEL_154G
